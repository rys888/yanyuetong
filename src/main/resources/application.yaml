server:
  port: 8081
spring:
  profiles:
    active: local
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: change_me
  redis:
    host: 127.0.0.1
    port: 6379
    password: change_me
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: change_me
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        # 手动 ack 模式下默认 recoverer 不会真正 nack、会卡死消费者，故关闭自动重试，由监听器显式 basicNack 进死信
        retry:
          enabled: false
mybatis-plus:
  type-aliases-package: com.hmdp.entity
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
hmdp:
  reservation:
    reconcile-interval-ms: 300000
    reconcile-threshold-ms: 600000
    reconcile-limit: 200
    dlq-max-replay: 3
